<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OQG Paper Trader - Admin Codes</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>OQG Paper Trader - Admin</h1>
  <nav>
    <a href="/admin">Overview</a>
    <a href="/admin/users">Users</a>
    <a href="/admin/competitions">Competitions</a>
    <a href="/admin/codes" class="current">Codes</a>
    <a href="/">Trade</a>
    <a href="/docs" target="_blank" rel="noopener">API docs</a>
  </nav>
  <div class="row">
    <span id="adminWho" class="muted"></span>
    <input id="token" type="password" placeholder="Admin token or admin API key" size="30" autocomplete="off">
    <button id="connect">Connect</button>
    <button id="logout" class="secondary" hidden>Disconnect</button>
  </div>
</header>
<main>
  <div id="status" class="msg" hidden></div>
  <div id="app" hidden>
    <div class="card" style="margin-bottom:16px">
      <h2>Make sign-up codes</h2>
      <p class="muted" style="margin-top:0">Give each member their own code. A code makes one account, then it stops working. Members enter it on the Trade page, under "Create your account".</p>
      <form id="genForm" class="comp-form" autocomplete="off" style="margin-top:0">
        <label class="muted">How many <input id="gCount" type="number" min="1" max="200" value="1" style="width:80px"></label>
        <label class="muted">Label <input id="gLabel" maxlength="60" placeholder="e.g. week 1 signups" style="width:200px"></label>
        <label class="muted">Uses per code <input id="gUses" type="number" min="1" max="1000" value="1" style="width:80px"></label>
        <label class="muted">Expires in (days) <input id="gDays" type="number" min="1" max="3650" placeholder="never" style="width:100px"></label>
        <button type="submit">Make codes</button>
      </form>
      <div id="fresh" hidden style="margin-top:12px">
        <div class="row" style="margin-bottom:6px"><strong id="freshTitle"></strong><button type="button" id="copyFresh" class="secondary">Copy these codes</button></div>
        <textarea id="freshBox" readonly rows="4" style="width:100%; font-family: ui-monospace, SFMono-Regular, Menlo, monospace"></textarea>
      </div>
      <div id="codeMsg" class="msg" style="margin-top:12px" hidden></div>
    </div>
    <div class="card">
      <div class="card-head">
        <h2>All codes</h2>
        <div class="row">
          <label class="row" style="gap:6px"><span class="muted">Show</span>
            <select id="filter" aria-label="Filter codes"><option value="all">All</option><option value="open">Still usable</option><option value="used">Used up</option><option value="dead">Revoked or expired</option></select></label>
          <button type="button" id="copyOpen" class="secondary">Copy all usable codes</button>
        </div>
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th class="l">Code</th><th class="l">Label</th><th class="l">Status</th><th>Used</th><th class="l">Used by</th><th class="l">Expires</th><th></th></tr></thead>
        <tbody id="codes"></tbody>
      </table></div>
    </div>
  </div>
</main>
<script src="/static/common.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const headers = () => AdminShell.headers();
let codes = [];
const usable = (c) => c.status === "unused" || c.status === "partly used";

function msg(text, isErr) { const el = $("codeMsg"); el.hidden = !text; el.textContent = text || ""; el.className = "msg" + (isErr ? " err" : ""); }

function render() {
  const f = $("filter").value;
  const list = codes.filter((c) => f === "all" || (f === "open" && usable(c)) || (f === "used" && c.status === "used") || (f === "dead" && (c.status === "revoked" || c.status === "expired")));
  const tb = $("codes"); tb.innerHTML = "";
  if (!list.length) tb.innerHTML = '<tr><td colspan="7" class="muted">No codes here. Make some above.</td></tr>';
  for (const c of list) {
    tb.insertAdjacentHTML("beforeend",
      `<tr><td class="l"><code>${esc(c.code)}</code></td><td class="l">${esc(c.label || "")}</td><td class="l">${esc(c.status)}</td><td>${esc(c.uses)} / ${esc(c.max_uses)}</td><td class="l">${esc(c.used_by.join(", "))}</td><td class="l">${c.expires_at ? esc(fmtTime(c.expires_at)) : "never"}</td><td>` +
      (usable(c) ? `<button type="button" class="secondary" data-copy="${esc(c.code)}">Copy</button> <button type="button" class="danger" data-revoke="${esc(c.id)}" data-code="${esc(c.code)}">Revoke</button>` : "") + `</td></tr>`);
  }
}

async function onData() { codes = await api("/api/admin/invites", headers()); render(); }

$("filter").addEventListener("change", render);
$("genForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const body = { count: parseInt($("gCount").value, 10) || 1, max_uses: parseInt($("gUses").value, 10) || 1 };
  if ($("gLabel").value.trim()) body.label = $("gLabel").value.trim();
  const days = parseFloat($("gDays").value);
  if (days > 0) body.expires_at = Date.now() / 1000 + days * 86400;
  try {
    const made = await api("/api/admin/invites", headers(), { method: "POST", body: JSON.stringify(body) });
    $("fresh").hidden = false;
    $("freshTitle").textContent = `Made ${made.length} code${made.length === 1 ? "" : "s"}`;
    $("freshBox").value = made.map((c) => c.code).join("\n");
    msg("", false); await AdminShell.refresh();
  } catch (err) { msg(err.message, true); }
});
$("copyFresh").onclick = async () => { $("copyFresh").textContent = (await copyText($("freshBox").value)) ? "Copied" : "Select the text and copy it"; };
$("copyOpen").onclick = async () => {
  const open = codes.filter(usable).map((c) => c.code).join("\n");
  msg(open ? ((await copyText(open)) ? "Copied every usable code" : "Couldn't copy automatically") : "No usable codes", !open);
};
$("codes").addEventListener("click", async (e) => {
  const cp = e.target.closest("button[data-copy]"), rv = e.target.closest("button[data-revoke]");
  if (cp) { await copyText(cp.dataset.copy); cp.textContent = "Copied"; setTimeout(() => (cp.textContent = "Copy"), 1200); }
  if (rv && confirm(`Revoke ${rv.dataset.code}? It will stop working.`)) {
    try { await api(`/api/admin/invites/${rv.dataset.revoke}`, headers(), { method: "DELETE" }); msg(`Revoked ${rv.dataset.code}`, false); AdminShell.refresh(); }
    catch (err) { msg(err.message, true); }
  }
});

AdminShell.start({ onData });
</script>
</body>
</html>
